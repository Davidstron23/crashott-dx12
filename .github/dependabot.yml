version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci" # PR titles become the squash message: keep Conventional Commits

  # Python packages of the asset tools (tools/requirements.txt). The ">=" minimums stay low on
  # purpose: only raise one when the range no longer allows the latest version.
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 3 # don't propose versions published less than 3 days ago
    groups:
      minor-and-patch:
        update-types: [minor, patch]
