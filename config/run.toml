# Spec 001, T3 (RF-28, RF-30 `shaders`): o dispositivo Direct3D 12 nasce, mas os shaders do presentador falham; o jogo solta a swap chain e volta ao
# Vulkan na mesma janela. Sem o gancho (exe de T2, onde `shaders` era "ignored") o Direct3D 12 ligaria e este perfil falharia. As capturas se comparam
# fora (boot: iguais, byte a byte, às do Vulkan da base).
[profiles.renderizador_d3d12_falha_shaders]
description = "CRASH_D3D12_FAIL=shaders: os shaders do presentador falham de propósito e o jogo volta ao Vulkan na mesma janela, sem cair"
test = true
timeout = 20
audio = false
userdata_mode = "copy"
screenshots = [300, 540]
renderer = "d3d12"
env = { CRASH_D3D12_FAIL = "shaders" }
expect = { exit = ["timeout"], min_frames = 480, log_absent = ['\[fatal\]', '\[crash\]', 'Direct3D 12 renderer on', 'neither Direct3D 12 nor Vulkan', 'shader warm-up off', 'ignored \(device'], log_contains = ['\[gpu\] renderer requested: d3d12 \(CRASH_RENDERER\)', '\[gpu\] CRASH_D3D12_FAIL=shaders: the Direct3D 12 shaders fail on purpose', '\[gpu\] Direct3D 12: present: shader compilation failed on purpose', '\[gpu\] Direct3D 12: the presenter.s shaders did not compile or link', '\[gpu\] Direct3D 12 could not start \((\d{1,3}|[12]\d{3}|3000) ms\): falling back to Vulkan', '\[gpu\] Vulkan renderer on .+; shader cache .+'] }

# Spec 006, T1 (RF-1): CRASH_D3D12_FAIL=removed quita el dispositivo con ID3D12Device5::RemoveDevice en el Present 120; el juego sale `fatal` con el
# motivo (DXGI_ERROR_*), como Vulkan con `device lost`. min_frames queda por debajo del fotograma del gancho; no lleva [fatal] en log_absent.
[profiles.renderizador_d3d12_perda]
description = "CRASH_D3D12_FAIL=removed: el dispositivo Direct3D 12 se pierde de propósito y el juego sale fatal con el motivo"
test = true
timeout = 20
audio = false
userdata_mode = "copy"
renderer = "d3d12"
env = { CRASH_D3D12_FAIL = "removed", CRASH_NO_HID = "1" }
expect = { exit = ["fatal"], min_frames = 30, log_absent = ['\[crash\]', 'falling back', 'Vulkan renderer on', 'Direct3D 12: could not'], log_contains = ['\[gpu\] renderer requested: d3d12 \(CRASH_RENDERER\)', '\[gpu\] Direct3D 12 renderer on .+; shader cache .+', '\[gpu\] CRASH_D3D12_FAIL=removed: Direct3D 12 removes the device on purpose', '\[fatal\] .*Direct3D 12: device lost .*DXGI_ERROR_[A-Z_]+ \(0x[0-9A-F]{8}\)'] }

[profiles.renderizador_d3d12_falha_desconhecida]
description = "CRASH_D3D12_FAIL com um valor desconhecido só avisa no log: o Direct3D 12 liga igual"
test = true
timeout = 20
audio = false
userdata_mode = "copy"
screenshots = [300, 540]
renderer = "d3d12"
env = { CRASH_D3D12_FAIL = "foo" }
expect = { exit = ["timeout"], min_frames = 480, log_absent = ['\[fatal\]', '\[crash\]', 'falling back', 'Vulkan renderer on', 'fails on purpose'], log_contains = ['\[gpu\] CRASH_D3D12_FAIL=foo ignored \(device \| shaders \| removed\)', '\[gpu\] Direct3D 12 renderer on .+; shader cache .+'] }

# Spec 001, T2 (DXIL): com o Direct3D 12, a camada do port (overlay, avisos) sai sobre preto. O que o log diz (DXIL assinado pelo dxil.dll, os
# 2 pipelines e os 4 compiles DXIL sem falha, nenhum erro de pipeline) se confere aqui; as capturas se comparam fora (overlay no mesmo lugar
# e com o mesmo texto que com --set renderer=vulkan, preto fora do painel). Sem dxil.dll ao lado do exe o perfil falha de propósito.
[profiles.renderizador_d3d12_overlay]
description = "renderer=d3d12 com overlay nas capturas: shaders DXIL assinados, present e overlay criados, sem voltar ao Vulkan"
test = true
timeout = 20
audio = false
userdata_mode = "copy"
screenshots = [300, 540]
renderer = "d3d12"
overlay = true
screenshot_overlay = true
expect = { exit = ["timeout"], min_frames = 480, log_absent = ['\[fatal\]', '\[crash\]', 'falling back', 'Vulkan renderer on', 'could not create', 'failed to compile', 'DXIL NOT signed', 'fails on purpose'], log_contains = ['\[gpu\] renderer requested: d3d12 \(CRASH_RENDERER\)', '\[gpu\] Direct3D 12: DXIL signed by dxil\.dll', '\[gpu\] Direct3D 12 renderer on .+; shader cache .+', '\[overlay\] mode full .*included in screenshots', '\[gpu\] d3d12: \d+ submits, \d+ pass pipelines, \d+ draw pipelines, \d+ DXIL compiles \(0 failed\)', '\[gpu\] Direct3D 12: game shaders: \d+ compiled, \d+ from cache, 0 failed'] }

[profiles.renderizador_d3d12_aviso]
description = "renderer=d3d12: o aviso SKIP VIDEO (camada do port, sem o overlay) aparece sobre preto na primeira abertura em vídeo; a captura sai 1 s depois do aviso"
test = true
timeout = 25
audio = false
userdata_mode = "copy"
renderer = "d3d12"
overlay = false
env = { CRASH_SETTINGS = "controls.prompts=xbox" }
input = [["@skip_prompt#1"], [1, "SHOT"]]
expect = { exit = ["timeout"], events = ["skip_prompt"], log_absent = ['\[fatal\]', '\[crash\]', 'falling back', 'Vulkan renderer on', 'could not create', 'failed to compile', 'DXIL NOT signed'], log_contains = ['\[gpu\] Direct3D 12: DXIL signed by dxil\.dll', '\[gpu\] d3d12: \d+ submits, \d+ pass pipelines, \d+ draw pipelines, \d+ DXIL compiles \(0 failed\)', '\[gpu\] Direct3D 12: game shaders: \d+ compiled, \d+ from cache, 0 failed'] }

# Spec 001, T4 (todas as fontes da escolha: settings.toml, CRASH_SETTINGS, CRASH_RENDERER e --renderer). Os casos com --renderer e a ordem completa
# de prioridade rodam o exe direto (build/t4_matrix.py); aqui ficam os que o run_game consegue provar. Cada um falha com o exe de T3, que ignora o arquivo e o
# CRASH_SETTINGS. Os arquivos de tests/userdata_renderer/ só diferem da base na linha renderer.
[profiles.renderizador_fonte_arquivo]
description = "settings.toml com renderer = \"DX12\" (alias em maiúsculas) liga o Direct3D 12 sem nenhuma variável: fonte settings.toml"
test = true
timeout = 20
audio = false
userdata_mode = "copy"
userdata_from = "tests/userdata_renderer/dx12"
expect = { exit = ["timeout"], min_frames = 300, log_absent = ['\[fatal\]', '\[crash\]', 'falling back', 'Vulkan renderer on', 'is not a renderer', 'invalid value'], log_contains = ['\[gpu\] renderer requested: d3d12 \(settings\.toml\)', '\[gpu\] Direct3D 12 renderer on .+; shader cache .+'] }

[profiles.renderizador_fonte_ajustes]
description = "CRASH_SETTINGS com video.renderer=d3d12 vence o settings.toml (que diz vulkan): fonte CRASH_SETTINGS"
test = true
timeout = 20
audio = false
userdata_mode = "copy"
userdata_from = "tests/userdata_renderer/vulkan"
env = { CRASH_SETTINGS = "video.renderer=d3d12" }
expect = { exit = ["timeout"], min_frames = 300, log_absent = ['\[fatal\]', '\[crash\]', 'falling back', 'Vulkan renderer on', 'invalid value'], log_contains = ['\[settings\] CRASH_SETTINGS overrides: video\.renderer=d3d12', '\[gpu\] renderer requested: d3d12 \(CRASH_SETTINGS\)', '\[gpu\] Direct3D 12 renderer on .+; shader cache .+'] }

[profiles.renderizador_fonte_invalida]
