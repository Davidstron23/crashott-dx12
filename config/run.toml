input = [["@cinematic_skipped"], [0.5, "SHOT"], ["@gameplay_ready"], [0.5, "SHOT"], [1, "LS", 0, 1, 2.5], [4, "SHOT"], [6, "START"], [7.5, "SHOT"], [9, "START"]]
expect = { exit = ["timeout"], events = ["level_start", "level_ready", "cinematic", "cinematic_skipped", "cinematic_done", "gameplay_ready", "pause"], log_absent = ['\[fatal\]', '\[crash\]', 'falling back', 'Vulkan renderer on', 'could not create', 'failed to compile', 'DXIL NOT signed', 'are not drawn \(not translated\)', 'are not created \(not supported here\)', 'does not compile to DXIL', 'no pipeline for vs', 'anti-aliasing .* off', 'lighting remaster off', 'SMAA unavailable', 'lighting remaster unavailable'], log_contains = ['SkipToLevel, StartLevel 0 L1_E1', '\[gpu\] Direct3D 12 renderer on .+; shader cache .+', '\[gpu\] d3d12: \d+ submits, \d+ pass pipelines, [1-9]\d* draw pipelines, \d+ DXIL compiles \(0 failed\)', '\[gpu\] Direct3D 12: game shaders: \d+ compiled, \d+ from cache, 0 failed', '\[gpu\] SMAA ready', '\[lighting\] ready', '\[lighting\] targets', '\[lighting\] \d+ frames, [\d.]+ ms of GPU per frame'] }

