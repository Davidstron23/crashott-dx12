# RF-11 de ponta a ponta com o run_game (saída 4 e o runner reabre). Chega a SETTINGS sem o guião de horas de configuracoes_reinicio, que em v1.07 não
# chega lá: CRASH_MENU_AUTOPILOT aperta por nó do frontend (70 = menu principal: DOWN x3, A = SETTINGS) e o resto é do input (LEFT = idioma, B = pergunta,
# A = reinicia). O fps_limit = 30 importa: tests/userdata_base tem fps_limit = 0 e, sem limite (~900 fps), os apertos de 200 ms do menu principal se perdem (é também por
# isso que configuracoes_reinicio "não chega" a SETTINGS; com video.fps_limit=30 ele passa). O jogo reaberto herda o env menos CRASH_RENDERER (e CRASH_MENU_AUTOPILOT, zerado em restart_env) e usa o do settings.toml (vulkan).
[profiles.renderizador_reinicio_limpa]
description = "Reinício a partir de SETTINGS com renderer=d3d12 (CRASH_RENDERER): o jogo reaberto já não leva a variável e arranca com o renderizador do settings.toml"
test = true
timeout = 45
audio = false
userdata_mode = "copy"
skip_intros = true
renderer = "d3d12"
env = { CRASH_MENU_AUTOPILOT = "70:DOWN:2500,70:DOWN:1200,70:DOWN:1200,70:A:1500", CRASH_SETTINGS = "video.fps_limit=30" }
input = [["@main_menu"], [10, "LEFT"], [11.5, "SHOT"], [12, "B"], [14, "SHOT"], [15, "A"]]
restart_env = { CRASH_MENU_AUTOPILOT = "" }
restart_input = [["@main_menu"], [2, "SHOT"]]
restart_timeout = 12
expect = { exit = ["timeout"], restarts = 1, events = ["main_menu#2"], log_absent = ['\[fatal\]', '\[crash\]', 'falling back'], log_contains = ['\[gpu\] renderer requested: d3d12 \(CRASH_RENDERER\)', '\[gpu\] Direct3D 12 renderer on', 'restart needed for IDIOMA', 'restart accepted', 'exiting with code 4', 'restarted from the settings screen', '\[gpu\] renderer requested: vulkan \(settings\.toml\)', '\[gpu\] Vulkan renderer on'] }

